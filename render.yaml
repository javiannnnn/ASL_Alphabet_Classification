services:
  - type: web
    name: asl-webapp
    runtime: python
    plan: free
    rootDir: asl_webapp
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /api/healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
